<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فروشگاه Hes_VPN</title>
    <!-- اسکریپت رسمی مینی اپ تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .header .logo-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
            font-size: 28px;
            color: #0f172a;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .plan-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .plan-card:active {
            transform: scale(0.98);
        }

        .plan-card.popular {
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(30, 41, 59, 0.85);
            box-shadow: 0 8px 20px -6px rgba(56, 189, 248, 0.15);
        }

        .badge {
            position: absolute;
            top: 0;
            left: 20px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #0f172a;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .plan-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-info h3 i {
            color: #38bdf8;
            font-size: 14px;
        }

        .plan-price {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }

        .buy-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .buy-btn:active {
            opacity: 0.8;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-badge">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <h1>Hes_VPN Store</h1>
        <p id="user-greeting">یک پلن را برای اتصال انتخاب کنید</p>
    </div>

    <div class="container">

        <!-- پلن ۱۰ گیگ -->
        <div class="plan-card">
            <div class="plan-info">
                <h3><i class="fa-solid fa-wifi"></i> ۱۰ گیگابایت</h3>
                <div class="plan-price">۵۰,۰۰۰ تومان <span style="font-size:11px; color:#64748b;">/ ۱ ماهه</span></div>
            </div>
            <button class="buy-btn" onclick="buyPlan('۱۰ گیگابایت', '۵۰,۰۰۰ تومان')">
                خرید <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <!-- پلن ۲۰ گیگ (پیشنهادی) -->
        <div class="plan-card popular">
            <div class="badge">پرطرفدار 🔥</div>
            <div class="plan-info">
                <h3><i class="fa-solid fa-bolt"></i> ۲۰ گیگابایت</h3>
                <div class="plan-price">۱۰۰,۰۰۰ تومان <span style="font-size:11px; color:#64748b;">/ ۱ ماهه</span></div>
            </div>
            <button class="buy-btn" onclick="buyPlan('۲۰ گیگابایت', '۱۰۰,۰۰۰ تومان')">
                خرید <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <!-- پلن ۳۰ گیگ -->
        <div class="plan-card">
            <div class="plan-info">
                <h3><i class="fa-solid fa-rocket"></i> ۳۰ گیگابایت</h3>
                <div class="plan-price">۱۵۰,۰۰۰ تومان <span style="font-size:11px; color:#64748b;">/ ۱ ماهه</span></div>
            </div>
            <button class="buy-btn" onclick="buyPlan('۳۰ گیگابایت', '۱۵۰,۰۰۰ تومان')">
                خرید <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <!-- پلن نامحدود -->
        <div class="plan-card">
            <div class="plan-info">
                <h3><i class="fa-solid fa-crown"></i> اشتراک نامحدود</h3>
                <div class="plan-price">۳۵۰,۰۰۰ تومان <span style="font-size:11px; color:#64748b;">/ ۱ ماهه</span></div>
            </div>
            <button class="buy-btn" onclick="buyPlan('نامحدود (ماهانه)', '۳۵۰,۰۰۰ تومان')">
                خرید <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

    </div>

    <div class="footer-note">
        <i class="fa-solid fa-shield-halved"></i>
        <span>اتصال امن، پرسرعت و بدون قطعی</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // آماده‌سازی مینی اپ
        tg.ready();
        tg.expand();

        // دریافت اسم کاربر از تلگرام
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const userName = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-greeting').innerText = `سلام ${userName} عزیز 👋 پلن خودت رو انتخاب کن:`;
        }

        function buyPlan(planName, planPrice) {
            // ایجاد افکت ویبره سبک موقع لمس دکمه
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            const data = {
                action: "buy_plan",
                plan: planName,
                price: planPrice
            };

            // ارسال داده به ربات
            try {
                tg.sendData(JSON.stringify(data));
            } catch (e) {
                alert("لطفاً مینی‌اپ را حتماً از داخل ربات تلگرام باز کنید!");
            }
        }
    </script>
</body>
</html>
